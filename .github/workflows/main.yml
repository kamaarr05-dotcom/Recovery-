```yaml
name: RecoverX Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    name: Test GitHub Runner
    runs-on: ubuntu-latest

    steps:
      - name: Test Runner
        run: |
          echo "================================"
          echo "RECOVERX RUNNER BERHASIL"
          echo "================================"
          echo "OS:"
          uname -a

          echo "USER:"
          whoami

          echo "DIRECTORY:"
          pwd

          echo "FILES:"
          ls -la

      - name: Test Checkout
        uses: actions/checkout@v4

      - name: Test Repository
        run: |
          echo "================================"
          echo "CHECKOUT BERHASIL"
          echo "================================"

          echo "Repository:"
          ls -la

          echo ""
          echo "ZIP FILE:"
          find . -maxdepth 3 -type f -iname "*.zip" -print
```
