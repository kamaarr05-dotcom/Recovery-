name: Build RecoverX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RecoverX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Inspect Repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ROOT ==="
          ls -la

          echo "=== FILES ==="
          find . -maxdepth 3 -type f -print | sort

      - name: Find Android Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ada file ZIP Android ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _recoverx_android
          mkdir -p _recoverx_android

          unzip -q "$ZIP_FILE" -d _recoverx_android

          echo "=== HASIL EXTRACT ==="
          find _recoverx_android -maxdepth 5 -type f -print | sort | head -300

      - name: Locate Gradle Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find _recoverx_android \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."

            echo "File yang tersedia:"
            find _recoverx_android -type f -print | sort | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts tidak ditemukan."

            echo "Struktur project:"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort

            exit 1
          fi

          echo "app/build.gradle.kts ditemukan."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            > /dev/null 2>&1 || true

      - name: Show Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 3 -type f -print | sort

          echo "=== GRADLE ==="
          gradle --version

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version 8.4 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper berhasil dibuat."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK HASIL BUILD ==="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak berhasil dibuat."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

      - name: Upload RecoverX APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
