name: Build RecoverX Android APK (Java 21)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Diagnostik file
      - name: List Repository Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Android Files ==="
          find . -maxdepth 3 -name "build.gradle*" -o -name "settings.gradle*"

      # 3. Setup Java 21 JDK (Eclipse Temurin)
      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Terima Lisensi Android SDK bawaan GitHub Runner
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          # Jika ada subfolder android, masuk ke folder tersebut
          if [ -d "android" ]; then
            cd android
          fi

          echo "Direktori kerja: $(pwd)"

          # Pastikan file gradlew executable
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      # 6. Upload file APK ke GitHub Artifacts
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Android-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
