name: Build RecoverX Android APK & Web App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Android APK (Java 21) & Web App (Node 20)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20 environment
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install NPM dependencies & build Web
      - name: Install NPM Dependencies & Build Web
        run: |
          npm ci || npm install
          npm run build

      # 4. Setup Java 21 JDK (Temurin)
      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Pastikan Gradle Wrapper siap dieksekusi
      - name: Prepare Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      # 7. Kompilasi Android Debug APK
      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 8. Upload File APK ke GitHub Artifacts
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 9. Upload Web Application Build
      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Web-Dist
          path: dist/
          retention-days: 30
