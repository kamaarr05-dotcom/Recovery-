name: Build RecoverX Android APK (Java 21)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 21 JDK (Eclipse Temurin)
      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Setup Gradle Resmi (Menangani cache, JVM arguments, & dependencies)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Terima Lisensi Resmi Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # 5. Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          # Masuk ke folder android jika ada
          if [ -d "android" ]; then
            cd android
          fi

          echo "Direktori build: $(pwd)"
          chmod +x gradlew || true

          # Jika gradle-wrapper.jar belum ada di repositori, buat wrapper 8.4 resmi otomatis
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Membuat Gradle Wrapper 8.4 lengkap..."
            gradle wrapper --gradle-version 8.4 --distribution-type bin
            chmod +x gradlew
          fi

          # Eksekusi build APK
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      # 6. Upload APK ke GitHub Artifacts
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Android-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
