name: Build RecoverX Android APK (Java 21)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Diagnostik file di runner
      - name: List Repository Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Mencari file build.gradle / settings.gradle ==="
          find . -maxdepth 3 -name "build.gradle*" -o -name "settings.gradle*"

      # 3. Pasang Java 21 JDK (Eclipse Temurin)
      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Pasang Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          # Jika project berada di dalam subfolder android/, masuk ke folder tersebut
          if [ -d "android" ]; then
            cd android
          fi

          echo "Direktori kompilasi: $(pwd)"

          # Jika gradlew belum ada, buat wrapper secara otomatis
          if [ ! -f "gradlew" ]; then
            echo "Membuat Gradle Wrapper 8.4..."
            gradle wrapper --gradle-version 8.4
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 6. Upload APK hasil build ke Artifacts GitHub
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Android-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
