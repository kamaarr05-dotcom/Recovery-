name: Build RecoverX APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Android Project
        run: |
          echo "Checking Android project..."

          if [ ! -d "android" ]; then
            echo "ERROR: Folder android tidak ditemukan."
            echo "Pastikan folder android/ sudah di-push ke repository GitHub."
            exit 1
          fi

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: android/settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: android/app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "Android project ditemukan."

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            > /dev/null 2>&1 || true

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper \
            --gradle-version 8.4 \
            --distribution-type bin

          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
